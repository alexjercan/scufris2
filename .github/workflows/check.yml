name: check

on:
  # Branch-filtered so release tags run this suite only through release.yml.
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # In the development shell, not beside it. The briefing tests run
      # `tools/briefing`, which imports markdown-it-py, and the shell is the
      # one place that dependency is declared. A runner's own `python3` runs
      # everything here until a briefing renders a page, and then stops.
      - name: Run JavaScript checks
        run: nix develop -c npm run check

      - name: Run Nix flake checks
        run: nix flake check -L
