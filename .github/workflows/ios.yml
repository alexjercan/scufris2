name: iOS

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ios.yml"
      - "surfaces/ios/**"
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "surfaces/ios/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: unsigned simulator build
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec surfaces/ios/project.yml

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Build and test without signing
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(
              device["udid"]
              for runtime, entries in devices.items()
              if "iOS" in runtime
              for device in entries
              if device["name"].startswith("iPhone") and device.get("isAvailable", True)
          ))
          ')"
          xcodebuild \
            -project surfaces/ios/Scufris.xcodeproj \
            -scheme Scufris \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            CODE_SIGNING_ALLOWED=NO \
            clean test
