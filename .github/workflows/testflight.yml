name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: signed archive and upload
    runs-on: macos-15
    environment: testflight
    env:
      APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec surfaces/ios/project.yml

      - name: Install signing material
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/scufris-signing.keychain-db"
          keychain_password="$(openssl rand -base64 36)"
          certificate="$RUNNER_TEMP/AppleDistribution.p12"
          profile="$RUNNER_TEMP/Scufris_App_Store.mobileprovision"
          profile_plist="$RUNNER_TEMP/Scufris_App_Store.plist"

          python3 - "$certificate" "$profile" <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys

          Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["APPLE_DISTRIBUTION_CERTIFICATE_P12"], validate=True)
          )
          Path(sys.argv[2]).write_bytes(
              base64.b64decode(os.environ["APPLE_PROVISIONING_PROFILE"], validate=True)
          )
          PY
          chmod 600 "$certificate" "$profile"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"

          security cms -D -i "$profile" >"$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_directory"
          installed_profile="$profiles_directory/$profile_uuid.mobileprovision"
          cp "$profile" "$installed_profile"

          api_key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$api_key_directory"
          api_key="$api_key_directory/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" >"$api_key"
          chmod 600 "$api_key"

          {
            printf 'SCUFRIS_KEYCHAIN=%s\n' "$keychain"
            printf 'SCUFRIS_PROFILE=%s\n' "$installed_profile"
            printf 'SCUFRIS_API_KEY=%s\n' "$api_key"
          } >>"$GITHUB_ENV"

      - name: Create signed archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project surfaces/ios/Scufris.xcodeproj \
            -scheme Scufris \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Scufris.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER='Scufris App Store' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SCUFRIS_KEYCHAIN" \
            clean archive

      - name: Export application
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat >"$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.alexjercan.scufris</key>
              <string>Scufris App Store</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Scufris.xcarchive" \
            -exportPath "$RUNNER_TEMP/ScufrisExport" \
            -exportOptionsPlist "$export_options"

      - name: Upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ScufrisExport/Scufris.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "${SCUFRIS_PROFILE:-}" "${SCUFRIS_API_KEY:-}"
          if [[ -n "${SCUFRIS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SCUFRIS_KEYCHAIN" || true
          fi
