[preferences.tracking]
keywords = { tool = "tatr", scope = "one-task-per-request" }
guidance = """
Use Tatr for substantial tracked work. Keep one task for one request and its
follow-up work. Record decisions and verification evidence under the task.
Skip task creation when the user explicitly requests untracked work.
"""

[preferences.workspace]
keywords = { workspace = "sprout", base = "master" }
guidance = """
Use a Sprout workspace for project implementation. Keep the main checkout on
master and land the completed Sprout explicitly.
"""

[preferences.implementation]
keywords = { harness = "pi", model = "openai-codex/gpt-5.6-sol", thinking = "medium" }
guidance = """
Keep orchestration narrow. Prefer product skills and small deterministic
helpers over extension complexity. Follow repository AGENTS.md instructions and
existing conventions.
"""

[preferences.independent-review]
keywords = { review = "independent-review", order = "first", harness = "pi", model = "openai-codex/gpt-5.6-sol", thinking = "medium" }
guidance = """
Repeat the implementation -> independent read-only review cycle, resolving its
findings each round, until the reviewer approves.
"""

[preferences.quick-review]
keywords = { review = "quick-review", order = "second", harness = "pi", mode = "rpc", model = "openai-codex/gpt-5.6-sol", thinking = "medium", extension = "npm:@alexjercan/quick-review@0.1.1" }
guidance = """
After independent review approves, start the standalone Quick Review extension
in its separate Pi RPC agent once as the final user approval gate. Keep
foreground Scufris responsive while that agent writes the walkthrough and
answers page questions. Do not use these Pi RPC settings for independent review.
"""

[preferences.verification]
keywords = { verification = "focused", typescript = "npm run check", packaging = "nix flake check" }
guidance = """
Run the cheapest relevant focused checks first. Use focused integration tests
and small end-to-end examples where practical.
"""

[preferences.landing]
keywords = { landing = "sprout", gate = "quick-review-approval" }
guidance = """
Land the approved Sprout with the guarded Sprout landing operation. Never infer
landing from worker completion or independent review.
"""
