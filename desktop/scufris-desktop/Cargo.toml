[package]
name = "scufris-desktop"
description = "Scufris voice pill and tray companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
cpal = "0.16.0"
getrandom = "0.3.4"
reqwest = { version = "0.12.28", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
scufris-control = { path = "../scufris-control" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
thiserror = "2.0.20"
x11rb = "0.13.2"

[lints]
workspace = true
