[package]
name = "scufris-desktop"
description = "Scufris voice pill and tray companion"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
cpal = "0.16.0"
getrandom = "0.3.4"
raw-window-handle = "0.6.2"
reqwest = { version = "0.12.28", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
scufris-control = { path = "../scufris-control" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.2"
thiserror = "2.0.20"
toml = { version = "0.9.12", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = "0.1.41"
tracing-journald = "0.3.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
x11rb = { version = "0.13.2", features = ["shape"] }

[lints]
workspace = true
