<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scufris</title>
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <main id="pill" class="pill" data-state="idle">
      <div class="orb">
        <canvas id="orb" width="64" height="64" aria-hidden="true"></canvas>
      </div>
      <p id="timer" class="timer"></p>
      <!-- The transcript the person edits. It has no place on a bare orb, but
           it is still what holds the words and the caret, so it stays here,
           invisible and focusable, and the review window mirrors it. -->
      <input
        id="transcript"
        class="transcript"
        type="text"
        autocomplete="off"
        spellcheck="false"
        aria-label="Transcript"
        hidden
      />
    </main>
    <script src="orb-engine.js"></script>
    <script src="pill.js"></script>
  </body>
</html>
