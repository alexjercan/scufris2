<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scufris</title>
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <main id="pill" class="pill" data-state="idle">
      <div class="orb">
        <span class="record"></span>
        <canvas id="orb" width="30" height="30" aria-hidden="true"></canvas>
      </div>
      <canvas
        id="wave"
        class="wave"
        width="64"
        height="26"
        aria-hidden="true"
      ></canvas>
      <div class="body">
        <p id="label" class="label">Scufris</p>
        <input
          id="transcript"
          class="transcript"
          type="text"
          autocomplete="off"
          spellcheck="false"
          hidden
        />
        <p id="detail" class="detail"></p>
      </div>
      <p id="timer" class="timer"></p>
    </main>
    <script src="orb-engine.js"></script>
    <script src="pill.js"></script>
  </body>
</html>
