<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scufris transcript</title>
    <link rel="stylesheet" href="review.css" />
  </head>
  <body>
    <main id="box" class="box" data-state="review">
      <!-- One run holds the whole transcript. The caret and the selection are
           blocks laid under it, in a layer of their own, so a caret that moves
           moves nothing else: splitting the words around it is what used to
           shift them a letter at a time. The two spans sit against each other
           because the newline between them would be a space in the words. -->
      <p id="text" class="text">
        <span id="marks" class="marks" aria-hidden="true"></span
        ><span id="words" class="run"></span
        ><span id="probe" class="probe" aria-hidden="true">0</span>
      </p>
      <p id="hint" class="hint"></p>
    </main>
    <script src="review.js"></script>
  </body>
</html>
