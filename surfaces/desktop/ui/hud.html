<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scufris</title>
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <main class="hud">
      <!-- The window is undecorated, so this strip is the whole of its
           chrome: what the window is on the left, and what the keys do on
           the right. -->
      <header class="crown">
        <span class="mark">scufris</span>
        <span id="notice" class="notice"></span>
      </header>
      <!-- Every line said, oldest at the top. The host pushes them as they
           are said and hands over the backlog when this page loads. The
           control over it is the way back to the newest line, and it is on
           screen only while there is somewhere to go. -->
      <div class="stream">
        <!-- The job list is the last item in the flow rather than a floor
             pinned under it: it is part of the conversation and scrolls away
             like any other line. -->
        <ol id="lines" class="lines" aria-label="Conversation">
          <li
            id="briefings"
            class="briefings"
            data-transient="briefings"
            hidden
          >
            <button
              id="briefing-toggle"
              class="briefing-toggle"
              type="button"
              aria-controls="briefing-rows"
              aria-expanded="false"
              aria-label="Expand briefings"
            >
              <span class="who">brief</span>
              <span class="briefing-toggle-body">
                <span id="briefing-meta" class="briefing-meta"></span>
                <span
                  id="briefing-toggle-mark"
                  class="briefing-toggle-mark"
                  aria-hidden="true"
                  >+</span
                >
              </span>
            </button>
            <div id="briefing-rows" class="rows"></div>
          </li>
          <li id="jobs" class="jobs" data-transient="jobs" hidden>
            <span class="who">jobs</span>
            <div id="rows" class="rows"></div>
          </li>
        </ol>
        <button
          id="latest"
          class="latest"
          type="button"
          hidden
          aria-label="Jump to the latest message"
        >
          <img class="latest-glyph" src="latest.svg" alt="" />
        </button>
        <p id="fresh" class="offscreen" role="status"></p>
      </div>
      <!-- The typing line. An ordinary field in a focused window, so the
           caret, the selection, and every editing key are the browser's. -->
      <form id="ask" class="ask">
        <div
          id="selected"
          class="selected"
          aria-label="Selected attachments"
        ></div>
        <div class="composer">
          <button
            id="attach"
            class="attach"
            type="button"
            aria-label="Attach a file"
          >
            +
          </button>
          <span class="caret" aria-hidden="true">&gt;</span>
          <textarea
            id="words"
            class="words"
            rows="1"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Say something to Scufris"
          ></textarea>
        </div>
      </form>
    </main>
    <script src="markdown.js"></script>
    <script src="hud.js"></script>
  </body>
</html>
